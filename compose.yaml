services:
  web:
    build: .
    image: csv-explorer
    ports:
      - "8000:8000"
    environment:
      CSV_EXPLORER_SECRET_KEY: a7f3c8d21e9b4f6a8c1d7e2f5b9a4c3e
    volumes:
      # DuckDB file + CSV drop folder live on the host so they survive rebuilds.
      - ./data:/app/data
    restart: unless-stopped
