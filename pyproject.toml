[project]
name = "csv-explorer"
version = "0.1.0"
description = "A Flask app that loads CSV files into DuckDB and shows them as paginated, filterable HTML tables."
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "duckdb>=1.1",
    "requests>=2.32",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
